<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glore SMP | Minecraft Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0b130f;
            color: #e2f0d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(11, 19, 15, 0.85), rgba(5, 10, 8, 0.95)), 
                        url('https://images.unsplash.com/photo-1511497584788-876761102346?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            z-index: -1;
        }

        header {
            padding: 30px 20px;
            text-align: center;
        }

        .logo-container {
            max-width: 450px;
            margin: 0 auto;
            animation: float 4s ease-in-out infinite;
        }

        .logo-container img {
            width: 100%;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
            border-radius: 12px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .launch-box {
            background: rgba(20, 35, 25, 0.75);
            border: 2px solid #2d6a4f;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            max-width: 600px;
            width: 100%;
            margin-bottom: 30px;
        }

        .launch-box h2 {
            color: #52b788;
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .launch-box p {
            font-size: 1.1rem;
            color: #b7e4c7;
            margin-bottom: 20px;
        }

        .progress-bar-container {
            background: #081c15;
            border-radius: 10px;
            height: 20px;
            width: 100%;
            border: 1px solid #2d6a4f;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, #52b788, #74c69d);
            height: 100%;
            width: 100%;
            border-radius: 8px;
        }

        .server-ip-box {
            background: rgba(11, 19, 15, 0.9);
            border: 1px dashed #52b788;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .server-ip-box:hover {
            border-color: #74c69d;
            background: rgba(15, 25, 20, 0.9);
        }

        .server-ip-box span {
            font-family: monospace;
            font-size: 1.3rem;
            color: #52b788;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-discord {
            background-color: #5865F2;
            color: white;
        }

        .btn-discord:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }

        .btn-copy {
            background-color: #2d6a4f;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-copy:hover {
            background-color: #1b4332;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #6c757d;
            border-top: 1px solid rgba(45, 106, 79, 0.2);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #52b788;
            color: #0b130f;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            animation: fadeInOut 2s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="banner.jpg" alt="Glore SMP Banner">
        </div>
    </header>

    <main>
        <div class="launch-box">
            <h2>🚀 Spuštění serveru</h2>
            <p>Server se oficiálně spustí hned, jakmile náš Discord dosáhne milníku <strong>100 členů</strong>!</p>
            
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p style="font-size: 0.95rem; margin-bottom: 20px;">Připoj se na Discord a pomoz nám odemknout spuštění!</p>

            <div class="server-ip-box" onclick="copyIP()" title="Kliknutím zkopíruješ IP">
                IP: <span id="serverIp">gloresmp.xyz</span> <i class="fa-regular fa-copy" style="margin-left: 8px; color: #52b788;"></i>
            </div>

            <div class="buttons">
                <a href="https://discord.gg/gloresmp" target="_blank" class="btn btn-discord">
                    <i class="fa-brands fa-discord"></i> Discord (100 členů cíl)
                </a>
                <button class="btn btn-copy" onclick="copyIP()">
                    <i class="fa-solid fa-copy"></i> Kopírovat IP
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Glore SMP | Verze 1.21+ | Všechna práva vyhrazena.</p>
    </footer>

    <div class="toast" id="toast">IP adresa zkopírována do schránky!</div>

    <script>
        function copyIP() {
            const ipText = "gloresmp.xyz";
            navigator.clipboard.writeText(ipText).then(() => {
                const toast = document.getElementById("toast");
                toast.style.display = "block";
                setTimeout(() => {
                    toast.style.display = "none";
                }, 2000);
            });
        }
    </script>
</body>
</html>
